
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPUS — Torre de Controle</title>
<script type="module" src="/checar-login.js"></script>
<script src="/js/nav.js" defer></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<style>
:root{--azul-d:#0a1f6b;--azul:#1e40af;--verde:#16a34a;--vm:#dc2626;--lj:#ea580c;--gold:#d4af37;--txt:#0b1437;--txtm:#3f4a6b;--txts:#6b7691;--glass:rgba(255,255,255,0.92);--border:rgba(15,23,42,0.08);--shadow:0 4px 20px rgba(0,0,0,0.1);--r:10px;--rl:16px;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:#eef2ff}
body{display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

.hdr{height:54px;flex-shrink:0;z-index:1000;display:flex;align-items:center;padding:0 18px;gap:14px;background:linear-gradient(135deg,rgba(10,15,40,.96),rgba(20,28,80,.96));border-bottom:1px solid rgba(212,175,55,.22);box-shadow:0 4px 20px rgba(10,15,40,.3)}
.hdr-brand{font-family:'Manrope',sans-serif;font-size:13px;font-weight:800;color:#d4af37;letter-spacing:1px}
.hdr-title{font-size:12px;font-weight:600;color:rgba(255,255,255,.7)}
.hdr-r{display:flex;gap:7px;margin-left:auto;align-items:center}
.hbadge{font-size:11px;color:rgba(216,226,255,.8);background:rgba(255,255,255,.08);padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.1)}
.tab-btn{height:34px;padding:0 13px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;transition:all .2s;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
.tab-btn.on{background:rgba(212,175,55,.2);color:#d4af37;border:1px solid rgba(212,175,55,.3)}

.main{display:flex;flex:1;overflow:hidden}

.painel{width:370px;flex-shrink:0;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:saturate(180%) blur(22px);border-right:1px solid rgba(255,255,255,.65);box-shadow:4px 0 24px -8px rgba(31,38,135,.1)}
.painel-hdr{padding:12px 14px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.5);flex-shrink:0}
.painel-title{font-size:10px;font-weight:700;color:var(--txts);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.filtros{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.filtro-btn{padding:4px 9px;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,.7);cursor:pointer;font-size:10px;font-weight:600;font-family:inherit;color:var(--txtm);transition:all .15s}
.filtro-btn.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.busca{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.8);font-family:inherit;font-size:12px;color:var(--txt);outline:none}

.painel-scroll{flex:1;overflow-y:auto;padding:10px}
.painel-scroll::-webkit-scrollbar{width:4px}
.painel-scroll::-webkit-scrollbar-thumb{background:rgba(15,23,42,.15);border-radius:2px}

.mot-card{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.8);border-radius:var(--rl);padding:12px;margin-bottom:8px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow)}
.mot-card:hover{transform:translateY(-1px);border-color:rgba(30,64,175,.25)}
.mot-card.sel{border-color:rgba(30,64,175,.5);background:rgba(219,234,254,.7);box-shadow:0 0 0 3px rgba(30,64,175,.1)}
.mot-hdr{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.mot-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px #fff}
.mot-dot.online{animation:pmot 2s infinite}
@keyframes pmot{0%,100%{box-shadow:0 0 0 2px #fff,0 0 0 0 rgba(34,197,94,.4)}50%{box-shadow:0 0 0 2px #fff,0 0 0 5px rgba(34,197,94,0)}}
.mot-nome{font-size:12px;font-weight:700;color:var(--txt);flex:1}
.mot-placa{font-size:10px;color:var(--txts);background:rgba(15,23,42,.06);padding:2px 7px;border-radius:5px}
.mot-contato{display:flex;gap:6px;margin-bottom:8px}
.contato-btn{flex:1;padding:7px 8px;border-radius:9px;border:none;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}
.contato-btn:active{transform:scale(.97)}
.btn-ligar{background:rgba(22,163,74,.12);color:#166534;border:1px solid rgba(22,163,74,.25)}
.btn-wapp{background:rgba(37,211,102,.12);color:#128c7e;border:1px solid rgba(37,211,102,.25)}
.mot-rota-info{font-size:10px;color:var(--txts);margin-bottom:7px}
.mot-prog{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:7px}
.mot-stat{text-align:center;background:rgba(255,255,255,.6);border-radius:7px;padding:5px 3px;border:1px solid var(--border)}
.mot-stat-l{font-size:8px;color:var(--txts);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:2px}
.mot-stat-v{font-size:12px;font-weight:800;color:var(--txt)}
.mot-bar{height:3px;border-radius:2px;background:rgba(15,23,42,.08);overflow:hidden;margin-bottom:7px}
.mot-bar-fill{height:100%;border-radius:2px;transition:width .5s}
.mot-ult{font-size:10px;color:var(--txts)}
.mot-fora{font-size:10px;font-weight:700;color:var(--vm);margin-top:3px}
.btn-finalizar{width:100%;margin-top:7px;padding:6px 10px;border:1px solid rgba(220,38,38,.3);border-radius:8px;background:rgba(220,38,38,.07);color:#991b1b;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;display:block;text-align:center;}
.btn-finalizar:hover{background:rgba(220,38,38,.15);border-color:rgba(220,38,38,.5);}

.paradas-list{margin-top:8px;border-top:1px solid var(--border);padding-top:8px;display:none}
.paradas-list.on{display:block}
.par-item{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid rgba(15,23,42,.04)}
.par-item:last-child{border-bottom:none}
.par-ico{font-size:13px;flex-shrink:0}
.par-txt{flex:1;min-width:0}
.par-cli{font-size:11px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.par-meta{font-size:10px;color:var(--txts)}
.par-hora{font-size:10px;color:var(--txts);flex-shrink:0}
.tag-fora{font-size:9px;font-weight:700;color:var(--vm);background:rgba(220,38,38,.1);padding:1px 5px;border-radius:4px;margin-left:3px}

.mw{flex:1;position:relative}
#map{width:100%;height:100%}

.resumo{position:absolute;top:12px;right:12px;z-index:500;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.8);border-top:3px solid var(--azul);border-radius:var(--rl);padding:11px 14px;min-width:210px;box-shadow:0 12px 32px rgba(31,38,135,.15)}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.res-k{background:rgba(255,255,255,.7);border:1px solid var(--border);border-radius:8px;padding:7px;text-align:center}
.res-l{font-size:8px;color:var(--txts);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:2px}
.res-v{font-size:15px;font-weight:800;color:var(--azul-d)}
.res-title{font-size:10px;font-weight:700;color:var(--txts);text-transform:uppercase;letter-spacing:.8px}

/* HISTÓRICO */
.hist-panel{display:none;position:absolute;inset:0;z-index:600;background:rgba(238,242,255,.99);overflow:hidden;flex-direction:column}
.hist-panel.on{display:flex}
.hist-hdr{padding:12px 18px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.8);flex-shrink:0}
.hist-title{font-size:13px;font-weight:800;color:var(--azul-d);margin-bottom:10px}

/* FILTROS HISTÓRICO — linha 1: datas */
.hist-filtros-datas{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.hist-filtros-datas label{font-size:10px;font-weight:700;color:var(--txts);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.hist-input{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.9);font-family:inherit;font-size:12px;outline:none;color:var(--txt)}
.hist-input:focus{border-color:var(--azul)}

/* FILTROS HISTÓRICO — linha 2: seletores + botões atalho */
.hist-filtros-sel{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hist-atalho{padding:4px 9px;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,.7);cursor:pointer;font-size:10px;font-weight:600;font-family:inherit;color:var(--txtm);transition:all .15s;white-space:nowrap}
.hist-atalho:hover{background:var(--azul);color:#fff;border-color:var(--azul)}
.hist-atalho.on{background:var(--azul);color:#fff;border-color:var(--azul)}

/* RESUMO HISTÓRICO */
.hist-resumo{display:flex;gap:8px;padding:8px 18px;background:rgba(255,255,255,.6);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.hist-res-item{flex:1;min-width:80px;background:#fff;border:1px solid var(--border);border-radius:9px;padding:7px 10px;text-align:center}
.hist-res-l{font-size:9px;font-weight:700;color:var(--txts);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.hist-res-v{font-size:16px;font-weight:800}

.hist-scroll{flex:1;overflow-y:auto;padding:14px 18px}
.hist-scroll::-webkit-scrollbar{width:5px}
.hist-scroll::-webkit-scrollbar-thumb{background:rgba(15,23,42,.15);border-radius:3px}

.ent-card{background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.8);border-radius:var(--rl);padding:13px;margin-bottom:9px;box-shadow:var(--shadow)}
.ent-hdr{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px}
.ent-ico{font-size:20px;flex-shrink:0;margin-top:2px}
.ent-info{flex:1}
.ent-cli{font-size:12.5px;font-weight:700;color:var(--txt)}
.ent-meta{font-size:11px;color:var(--txts);margin-top:2px;line-height:1.4}
.ent-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.badge-st{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px}
.b-entregue{background:rgba(22,163,74,.12);color:#166534;border:1px solid rgba(22,163,74,.25)}
.b-entregue-avaria{background:rgba(245,158,11,.12);color:#92400e;border:1px solid rgba(245,158,11,.25)}
.b-entregue-parcial{background:rgba(234,88,12,.12);color:#9a3412;border:1px solid rgba(234,88,12,.25)}
.b-devolucao{background:rgba(220,38,38,.12);color:#991b1b;border:1px solid rgba(220,38,38,.25)}
.b-fora{background:rgba(220,38,38,.1);color:var(--vm);border:1px solid rgba(220,38,38,.2);font-size:9px}

.ent-fotos-wrap{margin-top:10px}
.ent-fotos-lbl{font-size:10px;font-weight:700;color:var(--txts);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.ent-fotos{display:flex;gap:7px;flex-wrap:wrap}
.ent-foto{width:80px;height:80px;border-radius:9px;object-fit:cover;cursor:pointer;border:2px solid rgba(30,64,175,.15);transition:transform .15s;display:block}
.ent-foto:hover{transform:scale(1.05)}
.ent-foto-label{font-size:9px;color:var(--txts);text-align:center;margin-top:3px;font-weight:600}
.ent-foto-wrap{display:flex;flex-direction:column;align-items:center}
.ent-obs{font-size:11px;color:var(--txtm);margin-top:7px;padding:6px 8px;background:rgba(15,23,42,.04);border-radius:6px;font-style:italic}
.ent-mot{font-size:10px;font-weight:600;color:var(--azul);margin-top:4px}

.modal-foto{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;flex-direction:column}
.modal-foto.on{display:flex}
.modal-foto img{max-width:92vw;max-height:83vh;border-radius:12px;object-fit:contain}
.mf-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.15);border:none;color:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mf-info{color:rgba(255,255,255,.65);font-size:12px;margin-top:10px;text-align:center;max-width:90vw}

.empty{text-align:center;padding:32px 16px;color:var(--txts)}
.empty-icon{font-size:36px;margin-bottom:8px}
.ld{display:inline-block;width:14px;height:14px;border:2px solid rgba(30,64,175,.2);border-top-color:var(--azul);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Mapbox controls */
.map-controls{position:absolute;top:12px;left:12px;z-index:500;display:flex;flex-direction:column;gap:6px}
.map-style-panel{background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.8);border-radius:10px;padding:8px 10px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.map-style-label{font-size:9px;font-weight:700;color:var(--txts);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.map-style-btns{display:flex;gap:4px;flex-wrap:wrap}
.map-style-btn{padding:4px 8px;border-radius:6px;border:1px solid rgba(15,23,42,.12);background:rgba(255,255,255,.7);cursor:pointer;font-size:10px;font-weight:600;font-family:inherit;color:var(--txtm);transition:all .15s;white-space:nowrap}
.map-style-btn.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.map-traffic-btn{padding:7px 10px;border-radius:10px;border:1px solid rgba(15,23,42,.12);background:rgba(255,255,255,.92);backdrop-filter:blur(20px);cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;color:var(--txtm);transition:all .15s;box-shadow:0 4px 16px rgba(0,0,0,.15);text-align:left}
.map-traffic-btn.on{background:var(--lj);color:#fff;border-color:var(--lj)}
@media(max-width:700px){
  .painel{width:100%;border-right:none;border-bottom:1px solid rgba(255,255,255,.65);max-height:260px}
  .main{flex-direction:column}
  .hbadge{display:none}
  .tab-btn{font-size:10px;padding:0 8px}
}
</style>
<script type="module" src="/js/nav.js"></script>
</head>
<body>

<div class="hdr">
  <div class="hdr-brand">OPUS</div>
  <div class="hdr-title">Torre de Controle</div>
  <div class="hdr-r">
    <div class="hbadge" id="badge-mots">0 motoristas</div>
    <div class="hbadge" id="badge-hora">--:--</div>
    <button class="tab-btn on" id="tab-mapa" onclick="setAba('mapa')">🗺️ Mapa ao vivo</button>
    <button class="tab-btn" id="tab-hist" onclick="setAba('hist')">📋 Histórico</button>
  </div>
</div>

<div class="main">
  <div class="painel">
    <div class="painel-hdr">
      <div class="painel-title">Motoristas em rota</div>
      <div class="filtros">
        <button class="filtro-btn on" onclick="setFiltro('emrota',this)">🚗 Em rota</button>
        <button class="filtro-btn" onclick="setFiltro('todos',this)">Todos</button>
        <button class="filtro-btn" onclick="setFiltro('pendente',this)">⏳ Pendentes</button>
        <button class="filtro-btn" onclick="setFiltro('concluido',this)">✅ Concluídos</button>
      </div>
      <input class="busca" type="text" placeholder="Buscar motorista ou rota..." oninput="filtrarBusca(this.value)">
    </div>
    <div class="painel-scroll" id="painel-lista">
      <div class="empty"><div class="empty-icon">📡</div><div>Conectando ao Firebase...<br><div class="ld" style="margin:8px auto 0"></div></div></div>
    </div>
  </div>

  <div class="mw" style="position:relative">
    <div id="map"></div>

    <!-- Mapbox controls -->
    <div class="map-controls">
      <div class="map-style-panel">
        <div class="map-style-label">Estilo do mapa</div>
        <div class="map-style-btns">
          <button class="map-style-btn on" data-style="streets" onclick="setMapStyle('streets')">🗺 Ruas</button>
          <button class="map-style-btn" data-style="satellite" onclick="setMapStyle('satellite')">🛰 Satélite</button>
          <button class="map-style-btn" data-style="dark" onclick="setMapStyle('dark')">🌙 Dark</button>
          <button class="map-style-btn" data-style="navigation" onclick="setMapStyle('navigation')">🧭 Nav</button>
        </div>
      </div>
      <button class="map-traffic-btn" id="traffic-btn" onclick="toggleTraffic()">🚦 Trânsito ao vivo</button>
    </div>

    <div class="resumo">
      <div class="res-title">Resumo do dia</div>
      <div class="res-grid">
        <div class="res-k"><div class="res-l">Em rota</div><div class="res-v" id="r-emrota">0</div></div>
        <div class="res-k"><div class="res-l">Entregas</div><div class="res-v" id="r-entregas" style="color:#16a34a">0</div></div>
        <div class="res-k"><div class="res-l">Pendentes</div><div class="res-v" id="r-pendentes" style="color:#ea580c">0</div></div>
        <div class="res-k"><div class="res-l">Avarias</div><div class="res-v" id="r-avarias" style="color:#dc2626">0</div></div>
      </div>
    </div>

    <!-- HISTÓRICO -->
    <div class="hist-panel" id="hist-panel">
      <div class="hist-hdr">
        <div class="hist-title">📋 Histórico de Entregas</div>

        <!-- Linha 1: intervalo de datas -->
        <div class="hist-filtros-datas">
          <label>De</label>
          <input class="hist-input" type="date" id="hist-de" onchange="renderHistorico()">
          <label>até</label>
          <input class="hist-input" type="date" id="hist-ate" onchange="renderHistorico()">
          <!-- Atalhos de período -->
          <button class="hist-atalho" onclick="setAtalho('hoje',this)">Hoje</button>
          <button class="hist-atalho" onclick="setAtalho('ontem',this)">Ontem</button>
          <button class="hist-atalho on" onclick="setAtalho('7d',this)">7 dias</button>
          <button class="hist-atalho" onclick="setAtalho('30d',this)">30 dias</button>
          <button class="hist-atalho" onclick="setAtalho('mes',this)">Este mês</button>
        </div>

        <!-- Linha 2: filtros seletores -->
        <div class="hist-filtros-sel">
          <select class="hist-input" id="hist-mot" onchange="renderHistorico()">
            <option value="">Todos os motoristas</option>
          </select>
          <select class="hist-input" id="hist-status" onchange="renderHistorico()">
            <option value="">Todos os status</option>
            <option value="entregue">✅ Entrega completa</option>
            <option value="entregue-avaria">⚠️ Com avaria</option>
            <option value="entregue-parcial">📦 Parcial</option>
            <option value="devolucao">↩ Devolução</option>
          </select>
          <select class="hist-input" id="hist-rota" onchange="renderHistorico()">
            <option value="">Todas as rotas</option>
          </select>
        </div>
      </div>

      <!-- Resumo do período -->
      <div class="hist-resumo" id="hist-resumo">
        <div class="hist-res-item"><div class="hist-res-l">Total</div><div class="hist-res-v" id="hr-total" style="color:var(--azul-d)">0</div></div>
        <div class="hist-res-item"><div class="hist-res-l">Entregues</div><div class="hist-res-v" id="hr-ent" style="color:#16a34a">0</div></div>
        <div class="hist-res-item"><div class="hist-res-l">Com avaria</div><div class="hist-res-v" id="hr-avar" style="color:#f59e0b">0</div></div>
        <div class="hist-res-item"><div class="hist-res-l">Parciais</div><div class="hist-res-v" id="hr-parc" style="color:#ea580c">0</div></div>
        <div class="hist-res-item"><div class="hist-res-l">Devoluções</div><div class="hist-res-v" id="hr-dev" style="color:#dc2626">0</div></div>
        <div class="hist-res-item"><div class="hist-res-l">Fora do raio</div><div class="hist-res-v" id="hr-fora" style="color:#dc2626">0</div></div>
      </div>

      <div class="hist-scroll" id="hist-lista">
        <div class="empty"><div class="empty-icon">📦</div><div>Carregando histórico...</div></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-foto" id="modal-foto">
  <button class="mf-close" onclick="fecharFoto()">✕</button>
  <img id="mf-img" src="" alt="">
  <div class="mf-info" id="mf-info"></div>
</div>

<!-- Firebase com auth — usa o módulo ES6 já carregado pelo checar-login.js -->
<script type="module">
import { db as _db, auth } from '/js/firebase-init.js';
import { ref, onValue, update } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

function addTrafficLayer() {
  if (map.getSource('traffic')) return;
  try {
    map.addSource('traffic', { type:'vector', url:'mapbox://mapbox.mapbox-traffic-v1' });
    map.addLayer({ id:'traffic-layer', type:'line', source:'traffic', 'source-layer':'traffic',
      layout:{ visibility:'none' },
      paint:{ 'line-width':2.5, 'line-color':['match',['get','congestion'],'low','#2dc4b2','moderate','#f8c54a','heavy','#f97316','severe','#dc2626','#aaa'] }
    });
  } catch(e) {}
}

window.setMapStyle = function(s) {

  map.once('style.load', function() {
    addTrafficLayer();

function iniciarListener() {
  onValue(ref(_db, 'despachos'), function(snap) {
    despachos = snap.val() || {};
    renderPainel();
    atualizarMarcadores();
    atualizarResumo();
    atualizarSelects();
    document.getElementById('badge-mots').textContent = Object.keys(despachos).length + ' motoristas';
    if (abaAtual === 'hist') renderHistorico();
  }, function(err) {
    document.getElementById('painel-lista').innerHTML = '<div class="empty"><div class="empty-icon">❌</div><div>Erro Firebase:<br>' + err.message + '</div></div>';
  });
}

// ── PAINEL ────────────────────────────────────────────────────────────────────
window.renderPainel = function() {
  var tokens = Object.keys(despachos).filter(function(t) {
    var d = despachos[t];
    var nC = Object.keys(d.confirmacoes||{}).length, nP = (d.paradas||[]).length;
    if (filtroAtual==='emrota' && (!d.iniciou||d.concluido)) return false;
    if (filtroAtual==='pendente' && nC>=nP) return false;
    if (filtroAtual==='concluido' && !d.concluido) return false;
    if (buscaAtual) { var q=buscaAtual.toLowerCase(); if (!(d.motoristaNome||'').toLowerCase().includes(q)&&!(d.nomeRota||'').toLowerCase().includes(q)) return false; }
    return true;
  });

  if (!tokens.length) {
    document.getElementById('painel-lista').innerHTML = '<div class="empty"><div class="empty-icon">📡</div><div>Nenhum motorista encontrado</div></div>';
    return;
  }

  document.getElementById('painel-lista').innerHTML = tokens.map(function(t) {
    var d = despachos[t];
    var nC = Object.keys(d.confirmacoes||{}).length, nP = (d.paradas||[]).length;
    var pct = nP>0?(nC/nP*100):0;
    var cor = getCor(t);
    var online = d.iniciou && !d.concluido && d.gps && (Date.now()-(d.gps.ts||0))<120000;
    var status = !d.iniciou ? 'Aguardando início' : (d.concluido ? '✅ Concluído' : '🚗 Em rota');
    var sel = motoristaSel===t;
    var nE=0, nD=0, nA=0, nP2=0, nFora=0;
    Object.values(d.confirmacoes||{}).forEach(function(c){
      if (c.tipo==='entregue') nE++;
      else if (c.tipo==='devolucao') nD++;
      else if (c.tipo==='entregue-avaria') nA++;
      else if (c.tipo==='entregue-parcial') nP2++;
      if (c.foraRaio) nFora++;
    });
    var tel = (d.motoristaTel||'').replace(/\D/g,'');
    var telFmt = d.motoristaTel||'';
    var telWapp = '55'+tel;

    var html = '<div class="mot-card'+(sel?' sel':'')+'" id="mc-'+t+'" onclick="selecionarMot(\''+t+'\')">';
    html += '<div class="mot-hdr"><div class="mot-dot'+(online?' online':'')+'" style="background:'+cor+'"></div>';
    html += '<div class="mot-nome">'+(d.motoristaNome||'—')+'</div>';
    html += '<div class="mot-placa">'+(d.motoristaPlaca||'—')+'</div></div>';
    if (tel) {
      html += '<div class="mot-contato">';
      html += '<a class="contato-btn btn-ligar" href="tel:+'+telWapp+'" onclick="event.stopPropagation()">📞 '+telFmt+'</a>';
      html += '<a class="contato-btn btn-wapp" href="https://wa.me/'+telWapp+'" target="_blank" onclick="event.stopPropagation()">💬 WhatsApp</a>';
      html += '</div>';
    }
    html += '<div class="mot-rota-info">'+(d.nomeRota||'—')+' · '+status+'</div>';
    if (nFora>0) html += '<div class="mot-fora">⚠️ '+nFora+' confirmação(ões) fora do raio</div>';
    html += '<div class="mot-prog">';
    html += '<div class="mot-stat"><div class="mot-stat-l">Total</div><div class="mot-stat-v">'+nP+'</div></div>';
    html += '<div class="mot-stat"><div class="mot-stat-l" style="color:#16a34a">Entregue</div><div class="mot-stat-v" style="color:#16a34a">'+(nE+nA+nP2)+'</div></div>';
    html += '<div class="mot-stat"><div class="mot-stat-l" style="color:#ea580c">Dev.</div><div class="mot-stat-v" style="color:#ea580c">'+nD+'</div></div>';
    html += '<div class="mot-stat"><div class="mot-stat-l" style="color:#dc2626">Avaria</div><div class="mot-stat-v" style="color:#dc2626">'+nA+'</div></div>';
    html += '</div>';
    html += '<div class="mot-bar"><div class="mot-bar-fill" style="width:'+pct+'%;background:'+cor+'"></div></div>';
    html += '<div class="mot-ult">🕐 '+(d.gps?tempoRel(d.gps.ts):'sem GPS')+' · '+nC+'/'+nP+' paradas</div>';
    if (!d.concluido) {
      html += '<button class="btn-finalizar" onclick="event.stopPropagation();finalizarRota(\''+t+'\')" title="Marcar rota como concluída">⏹ Finalizar rota</button>';
    }
    if (sel) {
      html += '<div class="paradas-list on">';
      (d.paradas||[]).forEach(function(p,idx){
        var c = d.confirmacoes && d.confirmacoes[idx];
        var ico = c ? (c.tipo==='entregue'?'✅':c.tipo==='entregue-avaria'?'⚠️':c.tipo==='entregue-parcial'?'📦':c.tipo==='devolucao'?'↩':'✅') : '⏳';
        html += '<div class="par-item"><div class="par-ico">'+ico+'</div><div class="par-txt">';
        html += '<div class="par-cli">'+(p.cliente||'—')+(c&&c.foraRaio?'<span class="tag-fora">FORA RAIO</span>':'')+'</div>';
        html += '<div class="par-meta">'+(p.cidade||'')+'/'+( p.estado||'')+' · '+(p.peso||0)+' kg'+(c&&c.motivo?' · '+c.motivo:'')+'</div>';
        html += '</div><div class="par-hora">'+(c?c.hora||'':'')+'</div></div>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }).join('');
};

// ── MARCADORES ────────────────────────────────────────────────────────────────
function atualizarMarcadores() {
  Object.keys(despachos).forEach(function(t) {
    var d = despachos[t];
    if (!d.gps||!d.gps.lat) return;
    var cor = getCor(t);
    var nC = Object.keys(d.confirmacoes||{}).length, nP = (d.paradas||[]).length;
    if (marcadores[t]) {
      marcadores[t].setLngLat([d.gps.lng, d.gps.lat]);
      marcadores[t].getElement().innerHTML = mkMotIcoHTML(cor, d.motoristaNome, nC, nP);
    } else {
      var el = document.createElement('div');
      el.style.cssText = 'position:relative;cursor:pointer';
      el.innerHTML = mkMotIcoHTML(cor, d.motoristaNome, nC, nP);
      var popup = new mapboxgl.Popup({offset:20, maxWidth:'240px'}).setHTML(buildPopup(t,d));
      var m = new mapboxgl.Marker({element:el})
        .setLngLat([d.gps.lng, d.gps.lat])
        .setPopup(popup)
        .addTo(map);
      el.addEventListener('click', (function(tok){ return function(e){ e.stopPropagation(); selecionarMot(tok); }; })(t));
      marcadores[t] = m;
    }
    var pop = marcadores[t].getPopup();
    if (pop && pop.isOpen()) pop.setHTML(buildPopup(t,d));
  });
  atualizarVisibilidadeMarcadores();
  if (motoristaSel && despachos[motoristaSel]) desenharParadas(motoristaSel, despachos[motoristaSel]);
}

function mkMotIcoHTML(cor, nome, nC, nP) {
  var ini = (nome||'?').charAt(0).toUpperCase();
  return '<div style="width:38px;height:38px;border-radius:50%;background:'+cor+';border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.3)">'+ini+'</div>'
    +'<div style="position:absolute;bottom:-3px;right:-3px;background:#fff;border-radius:5px;padding:1px 4px;font-size:9px;font-weight:800;color:'+cor+';border:1px solid '+cor+'">'+nC+'/'+nP+'</div>';
}

function atualizarVisibilidadeMarcadores() {
  Object.keys(marcadores).forEach(function(t) {
    var d = despachos[t]; if (!d) return;
    var nC = Object.keys(d.confirmacoes||{}).length, nP = (d.paradas||[]).length;
    var visible = true;
    if (filtroAtual==='emrota' && (!d.iniciou||d.concluido)) visible = false;
    if (filtroAtual==='pendente' && nC>=nP) visible = false;
    if (filtroAtual==='concluido' && !d.concluido) visible = false;
    marcadores[t].getElement().style.display = visible ? '' : 'none';
  });
}

function buildPopup(t,d) {
  var nC = Object.keys(d.confirmacoes||{}).length, nP = (d.paradas||[]).length;
  var tel = (d.motoristaTel||'').replace(/\D/g,'');
  var telWapp = '55'+tel;
  return '<div style="font-family:Inter,sans-serif;min-width:180px">'
    +'<div style="font-size:13px;font-weight:700;margin-bottom:3px">🚗 '+(d.motoristaNome||'—')+'</div>'
    +'<div style="font-size:11px;color:#666;margin-bottom:2px">'+(d.nomeRota||'—')+'</div>'
    +'<div style="font-size:11px;color:#666;margin-bottom:2px">📦 '+nC+'/'+nP+' entregas</div>'
    +'<div style="font-size:11px;color:#666;margin-bottom:8px">🕐 '+(d.gps?tempoRel(d.gps.ts):'sem GPS')+'</div>'
    +(tel?'<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px">'
      +'<a href="tel:+'+telWapp+'" style="padding:6px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:7px;text-align:center;font-size:11px;font-weight:700;color:#166534;text-decoration:none">📞 Ligar</a>'
      +'<a href="https://wa.me/'+telWapp+'" target="_blank" style="padding:6px;background:#f0fff4;border:1px solid #bbf7d0;border-radius:7px;text-align:center;font-size:11px;font-weight:700;color:#128c7e;text-decoration:none">💬 WhatsApp</a>'
      +'</div>':'')
    +'<button onclick="selecionarMot(\''+t+'\')" style="width:100%;padding:6px;border:none;border-radius:6px;background:#1e40af;color:#fff;font-size:11px;font-weight:700;cursor:pointer">Ver detalhes</button>'
    +'</div>';
}

function desenharParadas(t,d) {
  paradaLy.forEach(function(m){ m.remove(); }); paradaLy=[];
  (d.paradas||[]).forEach(function(p,idx){
    if (!p.lat||!p.lng) return;
    var c = d.confirmacoes && d.confirmacoes[idx];
    var cor = c ? (c.tipo==='entregue'?'#22c55e':c.tipo==='entregue-avaria'?'#f59e0b':c.tipo==='entregue-parcial'?'#f97316':c.tipo==='devolucao'?'#dc2626':'#22c55e') : '#94a3b8';
    var el = document.createElement('div');
    el.style.cssText = 'width:22px;height:22px;border-radius:50%;background:'+cor+';border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer';
    el.textContent = idx+1;
    var tooltip = (idx+1)+'. '+(p.cliente||'—')+(c&&c.foraRaio?' ⚠ FORA DO RAIO':'');
    var m = new mapboxgl.Marker({element:el})
      .setLngLat([p.lng, p.lat])
      .setPopup(new mapboxgl.Popup({offset:10,closeButton:false}).setHTML('<div style="font-family:Inter,sans-serif;font-size:11px">'+tooltip+'</div>'))
      .addTo(map);
    paradaLy.push(m);
  });
}

window.selecionarMot = function(t) {
  motoristaSel = motoristaSel===t ? null : t;
  paradaLy.forEach(function(m){ m.remove(); }); paradaLy=[];
  if (motoristaSel && despachos[t]) {
    desenharParadas(t, despachos[t]);
    if (marcadores[t]) {
      var ll = marcadores[t].getLngLat();
      map.flyTo({center:[ll.lng, ll.lat], zoom:10, animate:true});
    }
  }
  renderPainel();
};

window.setAtalho = function(tipo, btn) {
  document.querySelectorAll('.hist-atalho').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  var hoje = new Date();
  var de = new Date(), ate = new Date();
  if (tipo==='hoje')   { /* de=hoje, ate=hoje */ }
  else if (tipo==='ontem') { de.setDate(de.getDate()-1); ate.setDate(ate.getDate()-1); }
  else if (tipo==='7d')  { de.setDate(de.getDate()-6); }
  else if (tipo==='30d') { de.setDate(de.getDate()-29); }

  document.getElementById('hist-de').value  = fmtDateInput(de);
  document.getElementById('hist-ate').value = fmtDateInput(ate);
  renderHistorico();
};

// ── HISTÓRICO ─────────────────────────────────────────────────────────────────
window.renderHistorico = function() {
  var lista = [];
  Object.keys(despachos).forEach(function(t) {
    var d = despachos[t];
    Object.keys(d.confirmacoes||{}).forEach(function(idx) {
      lista.push({
        token:t,
        motoristaNome:d.motoristaNome||'—',
        motoristaTel:d.motoristaTel||'',
        nomeRota:d.nomeRota||'—',
        parada:(d.paradas||[])[parseInt(idx)]||{},
        conf:d.confirmacoes[idx],
        idx:parseInt(idx)
      });
    });
  });

  var de  = document.getElementById('hist-de').value;
  var ate = document.getElementById('hist-ate').value;
  var fm  = document.getElementById('hist-mot').value;
  var fs  = document.getElementById('hist-status').value;
  var fr  = document.getElementById('hist-rota').value;

  // Converte strings de data para timestamps de início/fim do dia
  var tsDE  = de  ? new Date(de  + 'T00:00:00').getTime() : 0;
  var tsATE = ate ? new Date(ate + 'T23:59:59').getTime() : Infinity;

  lista = lista.filter(function(x) {
    var ts = x.conf.ts || 0;
    if (ts < tsDE || ts > tsATE) return false;
    if (fm && x.motoristaNome !== fm) return false;
    if (fs && x.conf.tipo !== fs) return false;
    if (fr && x.nomeRota !== fr) return false;
    return true;
  });
  lista.sort(function(a,b){ return (b.conf.ts||0)-(a.conf.ts||0); });

  // Resumo do período
  var totE=0, totA=0, totP=0, totD=0, totFora=0;
  lista.forEach(function(x){
    var t = x.conf.tipo;
    if (t==='entregue') totE++;
    else if (t==='entregue-avaria') { totE++; totA++; }
    else if (t==='entregue-parcial') { totE++; totP++; }
    else if (t==='devolucao') totD++;
    if (x.conf.foraRaio) totFora++;
  });
  document.getElementById('hr-total').textContent = lista.length;
  document.getElementById('hr-ent').textContent   = totE;
  document.getElementById('hr-avar').textContent  = totA;
  document.getElementById('hr-parc').textContent  = totP;
  document.getElementById('hr-dev').textContent   = totD;
  document.getElementById('hr-fora').textContent  = totFora;

  if (!lista.length) {
    document.getElementById('hist-lista').innerHTML = '<div class="empty"><div class="empty-icon">📦</div><div>Nenhuma entrega no período selecionado</div></div>';
    return;
  }

  var tipoLabel = { 'entregue':'Entrega completa', 'entregue-avaria':'Com avaria', 'entregue-parcial':'Parcial', 'devolucao':'Devolução' };
  var tipoIco   = { 'entregue':'✅', 'entregue-avaria':'⚠️', 'entregue-parcial':'📦', 'devolucao':'↩' };

  document.getElementById('hist-lista').innerHTML = lista.map(function(x) {
    var c=x.conf, p=x.parada;
    var ico = tipoIco[c.tipo] || '✅';
    var bCls = 'b-'+(c.tipo||'entregue');
    var tipoTxt = tipoLabel[c.tipo] || c.tipo;
    var dt = c.ts ? new Date(c.ts).toLocaleDateString('pt-BR') : '—';

    // Fotos — suporta formato antigo (avaria) e novo (extra)
    var fotosC = (c.fotos&&c.fotos.canhoto)||[];
    var fotosE = (c.fotos&&(c.fotos.extra||c.fotos.avaria))||[];
    var temFotos = fotosC.length || fotosE.length;
    var fotosHtml = '';
    if (temFotos) {
      fotosHtml = '<div class="ent-fotos-wrap"><div class="ent-fotos-lbl">📸 Fotos registradas</div><div class="ent-fotos">';
      fotosC.forEach(function(f,fi){ fotosHtml += '<div class="ent-foto-wrap"><img class="ent-foto" src="'+f+'" onclick="verFoto(\''+f+'\',\'Canhoto — '+(p.cliente||'')+'\')"><div class="ent-foto-label">Canhoto '+(fi+1)+'</div></div>'; });
      fotosE.forEach(function(f,fi){ fotosHtml += '<div class="ent-foto-wrap"><img class="ent-foto" src="'+f+'" onclick="verFoto(\''+f+'\',\'Foto extra — '+(p.cliente||'')+'\')"><div class="ent-foto-label">Extra '+(fi+1)+'</div></div>'; });
      fotosHtml += '</div></div>';
    }

    return '<div class="ent-card">'
      +'<div class="ent-hdr"><div class="ent-ico">'+ico+'</div><div class="ent-info">'
      +'<div class="ent-cli">'+(p.cliente||'—')+'</div>'
      +'<div class="ent-meta">'+(p.cidade||'')+'/'+( p.estado||'')+' · Ped. '+(p.pedido||'—')+' · '+(p.peso||0)+' kg</div>'
      +'<div class="ent-mot">🚗 '+x.motoristaNome+' · '+x.nomeRota+' · '+dt+' '+(c.hora||'')+'</div>'
      +'<div class="ent-badges">'
      +'<span class="badge-st '+bCls+'">'+tipoTxt+'</span>'
      +(c.foraRaio?'<span class="badge-st b-fora">⚠ Fora do raio · '+(c.distKm||'?')+' km</span>':'')
      +(c.motivo?'<span class="badge-st" style="background:rgba(15,23,42,.06);color:var(--txtm);border:1px solid var(--border)">'+c.motivo+'</span>':'')
      +'</div></div></div>'
      + fotosHtml
      +(c.obs?'<div class="ent-obs">💬 '+c.obs+'</div>':'')
      +(c.gps?'<div style="font-size:10px;color:var(--txts);margin-top:4px">📍 GPS: '+c.gps.lat.toFixed(5)+', '+c.gps.lng.toFixed(5)+'</div>':'')
      +'</div>';
  }).join('');
};

function atualizarSelects() {
  var selMot = document.getElementById('hist-mot'), valMot = selMot.value;
  var selRota = document.getElementById('hist-rota'), valRota = selRota.value;
  var nomes = [...new Set(Object.values(despachos).map(function(d){return d.motoristaNome||'';}).filter(Boolean))].sort();
  var rotas = [...new Set(Object.values(despachos).map(function(d){return d.nomeRota||'';}).filter(Boolean))].sort();
  selMot.innerHTML  = '<option value="">Todos os motoristas</option>' + nomes.map(function(n){return'<option value="'+n+'"'+(n===valMot?' selected':'')+'>'+n+'</option>';}).join('');
  selRota.innerHTML = '<option value="">Todas as rotas</option>' + rotas.map(function(r){return'<option value="'+r+'"'+(r===valRota?' selected':'')+'>'+r+'</option>';}).join('');
}

// ── RESUMO MAPA ───────────────────────────────────────────────────────────────
function atualizarResumo() {
  var emR=0, ent=0, pend=0, avar=0;
  Object.values(despachos).forEach(function(d){
    if (d.iniciou&&!d.concluido) emR++;
    var nP = (d.paradas||[]).length;
    Object.values(d.confirmacoes||{}).forEach(function(c){
      if (c.tipo==='entregue'||c.tipo==='entregue-avaria'||c.tipo==='entregue-parcial') ent++;
      else if (c.tipo==='entregue-avaria') avar++;
    });
    pend += nP - Object.keys(d.confirmacoes||{}).length;
  });
  document.getElementById('r-emrota').textContent   = emR;
  document.getElementById('r-entregas').textContent  = ent;
  document.getElementById('r-pendentes').textContent = Math.max(0,pend);
  document.getElementById('r-avarias').textContent   = avar;
}

// ── FINALIZAR ROTA ────────────────────────────────────────────────────────────
window.finalizarRota = function(token) {
  var d = despachos[token];
  if (!d) return;
  var nome = d.motoristaNome || 'este motorista';
  var nC = Object.keys(d.confirmacoes||{}).length;
  var nP = (d.paradas||[]).length;
  var pendentes = nP - nC;
  var msg = 'Finalizar a rota de ' + nome + '?\n\n'
    + nC + '/' + nP + ' paradas confirmadas';
  if (pendentes > 0) msg += ' (' + pendentes + ' ainda pendente' + (pendentes>1?'s':'') + ')';
  msg += '.\n\nA rota será marcada como concluída e sairá do painel ativo.';
  if (!confirm(msg)) return;

  update(ref(_db, 'despachos/' + token), { concluido: true })
    .then(function() { /* onValue atualiza automaticamente */ })
    .catch(function(err) { alert('Erro ao finalizar rota: ' + err.message); });
};

// ── FOTO ─────────────────────────────────────────────────────────────────────
window.verFoto = function(src,info) {
  document.getElementById('mf-img').src=src;
  document.getElementById('mf-info').textContent=info||'';
  document.getElementById('modal-foto').classList.add('on');
};
window.fecharFoto = function() { document.getElementById('modal-foto').classList.remove('on'); };

// ── UTILS ─────────────────────────────────────────────────────────────────────
function getCor(t) { if (!coresMot[t]) { coresMot[t]=CORES[corIdx%CORES.length]; corIdx++; } return coresMot[t]; }
function tempoRel(ts) {
  if (!ts) return 'nunca';
  var d = Math.floor((Date.now()-ts)/1000);
  if (d<60) return 'agora'; if (d<3600) return Math.floor(d/60)+'min atrás';
  if (d<86400) return Math.floor(d/3600)+'h atrás';
  return new Date(ts).toLocaleDateString('pt-BR');
}
function fmtDateInput(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
</script>
